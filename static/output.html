<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Pro · Output</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video, img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    body.idle, body.idle * { cursor: none; }
  </style>
</head>
<body>
  <!-- Only the video: no controls, no buttons. Double-click toggles full screen; the cursor hides itself. -->
  <video id="v" autoplay muted playsinline disablepictureinpicture></video>
  <img id="i" alt="" hidden>
  <script>
    // The video comes straight from the Magic Pro tab that opened this one (same page, no second
    // connection): the swapped video canvas as a live stream, or the server camera feed.
    const v = document.getElementById("v"), img = document.getElementById("i");
    let current = null;

    function host() {   // the Magic Pro page: the tab that opened us, or the page embedding us
      if (window.opener && !window.opener.closed) return window.opener;
      return window.parent !== window ? window.parent : null;
    }

    function attach() {
      const h = host();
      const src = h && h.magicOutputSource ? h.magicOutputSource() : null;
      if (!src) return;
      if (src.kind === "stream" && src.stream !== current) {
        current = src.stream;
        img.hidden = true; img.removeAttribute("src");
        v.hidden = false; v.srcObject = src.stream; v.play().catch(() => {});
      } else if (src.kind === "url" && src.url !== current) {
        current = src.url;
        v.hidden = true; v.srcObject = null;
        img.hidden = false; img.src = src.url;
      }
    }
    attach();
    setInterval(attach, 1000);          // follows a camera restart in the main tab

    let t;
    const wake = () => { document.body.classList.remove("idle"); clearTimeout(t); t = setTimeout(() => document.body.classList.add("idle"), 1500); };
    addEventListener("mousemove", wake);
    wake();
    addEventListener("dblclick", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  </script>
</body>
</html>
